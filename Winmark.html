<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winmark</title>
  <style>
    @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    }
    
    body {
      margin: 0px;
      font-family: 'inter', sans-serif;
    }
    
    header {
      position: sticky;
      top: 0;
      background: black;
      color: white;
      padding: 10px 5%;
      box-sizing: border-box;
    }

    .logo {
      font-size: 20px;
      margin: 0px;
      font-family: ;
    }

    .feedText {
      padding: 8px 15px;
      background: rgba(231,231,231,0.551);
      display: inline-block;
      border-radius: 20px;
    }

    main {
      margin: 5px;
    }

    .feed-card {
      width: 100%;
      border-radius: 10px;
      background: rgba(243,244,248,0.551);
      
    }

    .feed-thumb {
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .context {
      box-sizing: border-box;
      padding: 5px;
    }
  </style>
</head>
<body>
  <header>
    <p class="logo">
      Winmark
    </p>
  </header>

  <main>
    <p class="feedText">
    Headlines 
    </p>


    <div class="feed-card">
      <img src="https://m.media-amazon.com/images/M/MV5BOWVlMjIyNjQtYTBmZC00ZDJhLTlmODgtOWFjM2ZlYmNmYzU5XkEyXkFqcGc@._V1_.jpg" class="feed-thumb" alt="Thumbnail">

      <div class="context">
        <h3>
          Bleach Thousand-Year Blood War Delays
        </h3>
        <p>
          The final two episodes of Bleach: Thousand-Year Blood War Season 4 have been pushed back by about a month into October 2026 to enhance production quality, with Episode 49 now scheduled for October 19.
        </p>
      </div>
    </div>
  </main>
</body>
</html>
